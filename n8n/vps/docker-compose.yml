# CollabOS — production n8n stack for a single Ubuntu VPS.
#
#   caddy   :80/:443  public edge, automatic Let's Encrypt TLS
#   n8n     :5678     NOT published — only reachable through caddy
#   db      :5432     NOT published — only reachable from n8n
#
#   Deploy:  cd /opt/n8n && docker compose up -d
#   Logs:    docker compose logs -f n8n
#   Update:  docker compose pull && docker compose up -d
#
# Every value below comes from .env — copy .env.example and fill it in first.
# Variables written as ${FOO:?...} are mandatory: compose refuses to start
# rather than silently booting an insecure instance.
name: collabos-n8n

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # issued certificates — do not delete
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - n8n
    networks:
      - edge

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  n8n:
    # Pin this. `latest` is fine for the very first boot, but once you are live,
    # set N8N_IMAGE_TAG in .env to the version you tested so a `docker compose
    # pull` can never hand you a breaking release unattended.
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # --- persistence -------------------------------------------------
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

      # --- credential encryption ---------------------------------------
      # BACK THIS UP AND NEVER CHANGE IT. Lose it and every saved Gmail /
      # Meta / header-auth credential in the database becomes undecryptable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}

      # --- public address ----------------------------------------------
      # n8n terminates nothing itself; caddy does TLS and forwards plain HTTP.
      # These tell n8n what URL the outside world sees, which is what it prints
      # into webhook URLs and OAuth redirect URIs.
      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: "1"            # exactly one proxy (caddy) in front
      N8N_SECURE_COOKIE: "true"

      # --- housekeeping -------------------------------------------------
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}        # hours (14d)
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-50000}
      # Keep binary payloads on disk instead of bloating Postgres.
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem

      # --- hardening ------------------------------------------------------
      # Workflows cannot read process.env, so the encryption key and DB
      # password above stay out of reach of a Code node. Consequence: you
      # cannot use {{ $env.FOO }} in workflows — put the ingest URL straight
      # into the HTTP Request node and the secret into a credential.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      NODE_ENV: production
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files          # binary data + anything the Read/Write File node touches
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge                       # reachable by caddy
      - internal                   # reachable to db

networks:
  # caddy <-> n8n only. caddy has no route to Postgres.
  edge:
  # n8n <-> db only. Not exposed to the host or the internet.
  internal:
    internal: true

volumes:
  db_data:
  n8n_data:
  n8n_files:
  caddy_data:
  caddy_config:
  caddy_logs:
